<!-- Add Schedule Exception Modal - Updated for Sequelize DB -->
<div class="modal fade" id="addScheduleExceptionModal" tabindex="-1" aria-labelledby="addScheduleExceptionModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addScheduleExceptionModalLabel">
          <i class="fas fa-calendar-exclamation me-2"></i>Agregar Excepción de Horario
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="add-schedule-exception-form">
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="exception-reason" class="form-label fw-bold">Motivo <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="exception-reason" placeholder="Ej: Vacaciones, Feriado, Mantenimiento" required>
            </div>
            <div class="col-md-6">
              <label for="exception-recurring-type" class="form-label fw-bold">Recurrencia</label>
              <select class="form-select" id="exception-recurring-type">
                <option value="">No recurrente</option>
                <option value="yearly">Anual (mismo día cada año)</option>
              </select>
            </div>
          </div>
          
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="schedule-exception-start-date" class="form-label fw-bold">Fecha de inicio <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="schedule-exception-start-date" required>
            </div>
            <div class="col-md-6">
              <label for="schedule-exception-end-date" class="form-label fw-bold">Fecha de fin (Opcional)</label>
              <input type="date" class="form-control" id="schedule-exception-end-date">
              <small class="form-text text-muted">Dejar vacío para un solo día</small>
            </div>
          </div>
          
          <div class="card border-primary mb-3">
            <div class="card-header bg-primary text-white">
              <h6 class="mb-0"><i class="fas fa-cogs me-2"></i>Configuración del Horario</h6>
            </div>
            <div class="card-body">
              <div class="row mb-3">
                <div class="col-md-12">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="exception-is-closed">
                    <label class="form-check-label fw-bold text-danger" for="exception-is-closed">
                      <i class="fas fa-door-closed me-1"></i>Cerrado completamente
                    </label>
                  </div>
                </div>
              </div>
              
              <div id="custom-hours-section">
                <h6 class="text-muted mb-3">Horario personalizado:</h6>
                <div class="row">
                  <div class="col-md-3">
                    <label for="exception-open-time" class="form-label">Hora apertura</label>
                    <input type="time" class="form-control" id="exception-open-time" value="09:00">
                  </div>
                  <div class="col-md-3">
                    <label for="exception-close-time" class="form-label">Hora cierre</label>
                    <input type="time" class="form-control" id="exception-close-time" value="18:00">
                  </div>
                  <div class="col-md-3">
                    <label for="exception-break-start" class="form-label">Inicio almuerzo</label>
                    <input type="time" class="form-control" id="exception-break-start" value="13:00">
                  </div>
                  <div class="col-md-3">
                    <label for="exception-break-end" class="form-label">Fin almuerzo</label>
                    <input type="time" class="form-control" id="exception-break-end" value="14:00">
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <div class="mb-3">
            <label for="schedule-exception-description" class="form-label">Descripción adicional (opcional)</label>
            <textarea class="form-control" id="schedule-exception-description" rows="2" placeholder="Información adicional sobre la excepción..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="save-schedule-exception-btn">
          <i class="fas fa-save me-2"></i>Guardar Excepción
        </button>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const modal = document.getElementById('addScheduleExceptionModal');
  const saveBtn = document.getElementById('save-schedule-exception-btn');
  const form = document.getElementById('add-schedule-exception-form');
  const isClosedCheckbox = document.getElementById('exception-is-closed');
  const customHoursSection = document.getElementById('custom-hours-section');
  
  // Toggle custom hours section based on "is closed" checkbox
  isClosedCheckbox.addEventListener('change', function() {
    if (this.checked) {
      customHoursSection.style.display = 'none';
      // Clear time values when closed
      document.getElementById('exception-open-time').value = '';
      document.getElementById('exception-close-time').value = '';
      document.getElementById('exception-break-start').value = '';
      document.getElementById('exception-break-end').value = '';
    } else {
      customHoursSection.style.display = 'block';
      // Set default values
      document.getElementById('exception-open-time').value = '09:00';
      document.getElementById('exception-close-time').value = '18:00';
      document.getElementById('exception-break-start').value = '13:00';
      document.getElementById('exception-break-end').value = '14:00';
    }
  });
  
  if (saveBtn) {
    saveBtn.addEventListener('click', async function() {
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      
      const isClosed = isClosedCheckbox.checked;
      const recurringType = document.getElementById('exception-recurring-type').value;
      
      const data = {
        type: isClosed ? 'CLOSURE' : 'OVERRIDE_HOURS',
        startDate: document.getElementById('schedule-exception-start-date').value,
        endDate: document.getElementById('schedule-exception-end-date').value || null,
        reason: document.getElementById('exception-reason').value.trim(),
        description: document.getElementById('schedule-exception-description').value.trim(),
        recurringType: recurringType || null,
        isClosed: isClosed
      };
      
      // Only include custom hours if not closed
      if (!isClosed) {
        data.customOpenTime = document.getElementById('exception-open-time').value;
        data.customCloseTime = document.getElementById('exception-close-time').value;
        data.customBreakStart = document.getElementById('exception-break-start').value || null;
        data.customBreakEnd = document.getElementById('exception-break-end').value || null;
      }
      
      try {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Guardando...';
        
        const response = await fetch('/api/admin/schedule-exceptions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok) {
          alert('Excepción de horario guardada exitosamente');
          bootstrap.Modal.getInstance(modal).hide();
          form.reset();
          
          // Reset to default state
          customHoursSection.style.display = 'block';
          document.getElementById('exception-open-time').value = '09:00';
          document.getElementById('exception-close-time').value = '18:00';
          document.getElementById('exception-break-start').value = '13:00';
          document.getElementById('exception-break-end').value = '14:00';
          
          // Refresh schedule exceptions list if function exists
          if (typeof loadScheduleExceptions === 'function') {
            loadScheduleExceptions();
          } else if (typeof refreshExceptionsTable === 'function') {
            refreshExceptionsTable();
          }
        } else {
          alert('Error: ' + (result.error || 'No se pudo guardar la excepción'));
        }
      } catch (error) {
        console.error('Error saving schedule exception:', error);
        alert('Error al conectar con el servidor');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fas fa-save me-2"></i>Guardar Excepción';
      }
    });
  }
  
  // Reset form when modal is closed
  modal.addEventListener('hidden.bs.modal', function() {
    form.reset();
    customHoursSection.style.display = 'block';
    document.getElementById('exception-open-time').value = '09:00';
    document.getElementById('exception-close-time').value = '18:00';
    document.getElementById('exception-break-start').value = '13:00';
    document.getElementById('exception-break-end').value = '14:00';
  });
});
</script>
