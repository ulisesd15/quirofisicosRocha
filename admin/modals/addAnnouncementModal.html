<!-- Add Announcement Modal extracted from adminOptions.html
     This modal allows admins to add announcements. -->
<div class="modal fade" id="addAnnouncementModal" tabindex="-1" aria-labelledby="addAnnouncementModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addAnnouncementModalLabel">
          <i class="fas fa-bullhorn me-2"></i>Agregar Anuncio
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="add-announcement-form">
          <div class="mb-3">
            <label for="announcement-title" class="form-label">Título</label>
            <input type="text" class="form-control" id="announcement-title" required>
          </div>
          <div class="mb-3">
            <label for="announcement-message" class="form-label">Mensaje</label>
            <textarea class="form-control" id="announcement-message" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label for="announcement-type" class="form-label">Tipo</label>
            <select class="form-select" id="announcement-type">
              <option value="info">Información</option>
              <option value="warning">Advertencia</option>
              <option value="danger">Urgente</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="save-announcement-btn">Publicar</button>
      </div>
    </div>
  </div>
</div>
