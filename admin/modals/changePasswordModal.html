<!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas fa-key me-2"></i>Cambiar Contraseña de Administrador
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="alert alert-info">
          <i class="fas fa-info-circle me-2"></i>
          Por seguridad, debes proporcionar tu contraseña actual para establecer una nueva.
        </div>
        <form id="admin-password-form">
          <div class="mb-3">
            <label for="admin-current-password" class="form-label">
              <i class="fas fa-lock me-1"></i>Contraseña Actual <span class="text-danger">*</span>
            </label>
            <input type="password" class="form-control" id="admin-current-password" required>
          </div>
          <div class="mb-3">
            <label for="admin-new-password" class="form-label">
              <i class="fas fa-key me-1"></i>Nueva Contraseña <span class="text-danger">*</span>
            </label>
            <input type="password" class="form-control" id="admin-new-password" minlength="6" required>
            <div class="form-text">La contraseña debe tener al menos 6 caracteres.</div>
          </div>
          <div class="mb-3">
            <label for="admin-confirm-password" class="form-label">
              <i class="fas fa-check me-1"></i>Confirmar Nueva Contraseña <span class="text-danger">*</span>
            </label>
            <input type="password" class="form-control" id="admin-confirm-password" minlength="6" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times"></i> Cancelar
        </button>
        <button type="button" class="btn btn-primary" id="save-admin-password">
          <i class="fas fa-save"></i> Cambiar Contraseña
        </button>
      </div>
    </div>
  </div>
</div>
