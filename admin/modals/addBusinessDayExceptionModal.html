<!-- Business Day Exception Modal (extracted from adminOptions.html) -->
<div class="modal fade" id="addBusinessDayExceptionModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Agregar Ajuste de Horario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="add-business-day-exception-form">
          <div class="mb-3">
            <label for="exception-title" class="form-label">Título del Ajuste</label>
            <input type="text" class="form-control" id="exception-title" required placeholder="Ej: Cerrado por feriado, Horario especial, etc.">
          </div>
          <div class="mb-3">
            <label for="business-exception-description" class="form-label">Descripción</label>
            <textarea class="form-control" id="business-exception-description" rows="2" placeholder="Detalles del ajuste de horario"></textarea>
          </div>
          <div class="row">
            <div class="col-md-6">
              <label for="business-exception-start-date" class="form-label">Fecha de Inicio</label>
              <input type="date" class="form-control" id="business-exception-start-date" required>
            </div>
            <div class="col-md-6">
              <label for="business-exception-end-date" class="form-label">Fecha de Fin</label>
              <input type="date" class="form-control" id="business-exception-end-date" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Ajuste de Horario</label>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="schedule-adjustment" id="closed-all-day" value="closed" checked>
              <label class="form-check-label" for="closed-all-day">
                Cerrado todo el día
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="schedule-adjustment" id="custom-hours" value="custom">
              <label class="form-check-label" for="custom-hours">
                Horario personalizado
              </label>
            </div>
          </div>
          <div id="custom-hours-section" class="mb-3 d-none">
            <div class="row">
              <div class="col-md-6">
                <label for="day-custom-open-time" class="form-label">Hora de Apertura</label>
                <input type="time" class="form-control" id="day-custom-open-time">
              </div>
              <div class="col-md-6">
                <label for="day-custom-close-time" class="form-label">Hora de Cierre</label>
                <input type="time" class="form-control" id="day-custom-close-time">
              </div>
            </div>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="exception-recurring">
            <label class="form-check-label" for="exception-recurring">
              Repetir anualmente
            </label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="save-business-day-exception">Guardar Ajuste</button>
      </div>
    </div>
  </div>
</div>
